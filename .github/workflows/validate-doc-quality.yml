name: Validate Documentation Quality

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/validate_doc_quality.py'
      - '.github/workflows/validate-doc-quality.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'scripts/validate_doc_quality.py'
      - '.github/workflows/validate-doc-quality.yml'

jobs:
  validate-doc-quality:
    name: Validate Documentation Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Validate changed documentation quality (blocking)
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && \
               git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            BASE="${{ github.event.before }}"
          else
            BASE="HEAD~1"
          fi
          if ! python scripts/validate_doc_quality.py --changed-only --base-ref "$BASE"; then
            echo "::error::Documentation quality validation failed on changed files. Fix tail-section order, CLI explanation tables, long-flag usage, Mermaid diagram-id metadata, content_validation metadata, or masked sensitive values as reported above."
            exit 1
          fi

      - name: Full advisory documentation quality scan (non-blocking)
        continue-on-error: true
        run: |
          python scripts/validate_doc_quality.py --all
